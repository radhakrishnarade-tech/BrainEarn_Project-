name: brain_earn
description: "A beautiful purple theme Earning App with multi-ad network and strict anti-cheat security."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ಫೈರ್‌ಬೇಸ್ ಮತ್ತು ಗೂಗಲ್ ಲಾಗಿನ್ ಲೈಬ್ರರಿಗಳು
  firebase_core: ^3.0.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  google_sign_in: ^6.1.6

  # ಡಿವೈಸ್ ಐಡಿ ಮತ್ತು ವಿಪಿಎನ್/ಆಂಟಿ-ಚೀಟ್ ಭದ್ರತೆಗಾಗಿ
  device_info_plus: ^10.1.0
  vpn_check: ^0.0.3

  # ನೀವು ಕೇಳಿದ ನಾಲ್ಕೂ ಆಡ್ ನೆಟ್‌ವರ್ಕ್‌ಗಳು
  google_mobile_ads: ^5.0.0
  unity_ads_plugin: ^0.4.3
  applovin_max: ^3.0.0
  startapp: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
